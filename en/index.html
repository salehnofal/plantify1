<style>
.carousel-item img {
  width: 100%;
  height: 60vh;
  object-fit: cover;
}

@media (max-width: 768px) {
  .carousel-item img {
    height: 40vh;
  }
}

.carousel-control-prev-icon,
.carousel-control-next-icon {
  background-color: black;
  border-radius: 50%;
  padding: 20px;
}

.carousel-caption {
  background: rgba(0,0,0,0.4);
  padding: 15px;
  border-radius: 10px;
}
</style>

<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

  <div class="carousel-indicators">
    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2"></button>
  </div>

  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="pp1.jpg" alt="Plant Collection">
      <div class="carousel-caption text-start">
        <h2>Plant Collection</h2>
        <p>Beautiful plants for your home</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="pp3.jpg" alt="Fresh & Green">
      <div class="carousel-caption">
        <h2>Fresh & Green</h2>
        <p>Natural indoor plants</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="pp2.jpg" alt="Decor Your Space">
      <div class="carousel-caption ">
        <h2>Decor Your Space</h2>
        <p>Make your home alive</p>
      </div>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
